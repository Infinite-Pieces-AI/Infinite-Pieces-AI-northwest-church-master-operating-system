version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      supabase:
        patterns: ["@supabase/*", "supabase"]
      test-tooling:
        patterns: ["vitest", "@playwright/test"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
