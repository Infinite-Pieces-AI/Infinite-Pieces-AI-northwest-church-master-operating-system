name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-ministry-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/gifts-prayer-recovery-ministries' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Normalize ministry release candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "scripts/normalize-ministry-release.mjs";
          let source = fs.readFileSync(path, "utf8");
          source = source.replaceAll(
            "0039_recovery_outreach_partner_actions.sql",
            "0041_recovery_outreach_partner_actions.sql",
          );
          const needle = `  replaceInFile(path, canonicalReplacements);\n}\n`;
          const restoration = `${needle}\n// Keep the original community prayer-intake table and its policies/tests.\n// The richer Prayer Well uses member_prayer_requests from migration 0027.\nfor (const path of [\n  "supabase/migrations/0005_community.sql",\n  "supabase/migrations/0008_rls_helpers_and_policies.sql",\n  "supabase/tests/0002_rls_boundaries.test.sql",\n]) {\n  replaceInFile(path, [["member_prayer_requests", "prayer_requests"]]);\n}\n`;
          if (!source.includes("Keep the original community prayer-intake table")) {
            if (!source.includes(needle)) throw new Error("Normalizer insertion point was not found");
            source = source.replace(needle, restoration);
          }
          fs.writeFileSync(path, source);
          NODE
          node scripts/normalize-ministry-release.mjs
      - name: Commit normalized ministry release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization changes were produced."
            exit 0
          fi
          git commit -m "fix: normalize ministry migrations and release workflows"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    needs: normalize-ministry-release
    if: always() && (needs.normalize-ministry-release.result == 'success' || needs.normalize-ministry-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Verify repository safety and structure
        run: |
          pnpm verify:structure
          pnpm verify:no-real-data
          pnpm verify:sql-static
          pnpm verify:workspace
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_HUB_URL: http://localhost:3001
          NEXT_PUBLIC_ENABLE_DEMO: "false"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_ENABLE_DEMO: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
