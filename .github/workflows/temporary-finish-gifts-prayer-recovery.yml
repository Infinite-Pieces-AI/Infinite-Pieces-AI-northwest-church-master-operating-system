name: Temporary Finish Gifts Prayer Recovery Ministries

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

concurrency:
  group: temporary-finish-gifts-prayer-recovery
  cancel-in-progress: true

jobs:
  apply-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Apply completion patches
        run: node scripts/apply-gifts-prayer-recovery-completion.mjs

      - name: Correct database test plan and preview test environment
        shell: bash
        run: |
          sed -i 's/select plan(29);/select plan(33);/' supabase/tests/0008_gifts_prayer_recovery_ministries.test.sql
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'playwright.config.ts';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replace(
            'env: { NEXT_PUBLIC_ENABLE_DEMO: "true" },',
            'env: { NEXT_PUBLIC_ENABLE_DEMO: "true", ALLOW_LOCAL_PREVIEW_MODE: "true" },',
          );
          fs.writeFileSync(path, content);
          NODE

      - name: Remove temporary applicator and workflow
        run: |
          rm -f scripts/apply-gifts-prayer-recovery-completion.mjs
          rm -f .github/workflows/temporary-finish-gifts-prayer-recovery.yml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Commit completed ministry expansion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: complete Gifts Prayer and Recovery ministry platform"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
