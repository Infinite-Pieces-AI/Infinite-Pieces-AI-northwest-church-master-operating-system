name: Temporary Ministry Expansion Finalizer V2

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

concurrency:
  group: temporary-ministry-expansion-finalizer-v2
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out ministry feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Replace completed integration files
        shell: bash
        run: |
          cp .github/ministry-finalize-v2/mobile-nav.tsx apps/church-hub/components/mobile-nav.tsx
          cp .github/ministry-finalize-v2/ministry-navigator.tsx apps/church-hub/components/ministry-navigator.tsx
          cp .github/ministry-finalize-v2/navigation-route.ts apps/church-hub/app/api/ai/navigation/route.ts
          cp .github/ministry-finalize-v2/prayer-page.tsx 'apps/church-hub/app/(protected)/prayer/page.tsx'
          cp .github/ministry-finalize-v2/recovery-page.tsx 'apps/church-hub/app/(protected)/recovery/page.tsx'
          cp .github/ministry-finalize-v2/gifts-page.tsx 'apps/church-hub/app/(protected)/gifts/page.tsx'
          cp .github/ministry-finalize-v2/app-shell.tsx apps/church-hub/components/app-shell.tsx
          cp .github/ministry-finalize-v2/outreach-nav.tsx apps/outreach-command/components/outreach-nav.tsx

      - name: Patch platform integration points
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def append_once(path: str, marker: str, content: str) -> None:
              current = read(path)
              if marker not in current:
                  write(path, current.rstrip() + "\n\n" + content.strip() + "\n")

          outreach_layout_path = "apps/outreach-command/app/layout.tsx"
          outreach_layout = read(outreach_layout_path)
          if 'import "./recovery-outreach.css";' not in outreach_layout:
              outreach_layout = outreach_layout.replace(
                  'import "./features.css";',
                  'import "./features.css";\nimport "./recovery-outreach.css";',
              )
              write(outreach_layout_path, outreach_layout)

          public_home_path = "apps/public-web/app/page.tsx"
          public_home = read(public_home_path)
          if "RecoverySupportFeature" not in public_home:
              lines = public_home.splitlines()
              last_import = max(i for i, line in enumerate(lines) if line.startswith("import "))
              lines.insert(
                  last_import + 1,
                  'import { RecoverySupportFeature } from "@/components/recovery-support-feature";',
              )
              public_home = "\n".join(lines) + ("\n" if public_home.endswith("\n") else "")
              closing_main = public_home.rfind("</main>")
              if closing_main == -1:
                  raise RuntimeError("Unable to find public homepage </main> insertion point")
              public_home = (
                  public_home[:closing_main]
                  + "  <RecoverySupportFeature />\n      "
                  + public_home[closing_main:]
              )
              write(public_home_path, public_home)

          sitemap_path = "apps/public-web/app/sitemap.ts"
          sitemap = read(sitemap_path)
          if "/recovery-support-lowell" not in sitemap:
              if '"/plan-a-visit",' in sitemap:
                  sitemap = sitemap.replace(
                      '"/plan-a-visit",',
                      '"/plan-a-visit",\n    "/recovery-support-lowell",',
                      1,
                  )
              elif "'/plan-a-visit'," in sitemap:
                  sitemap = sitemap.replace(
                      "'/plan-a-visit',",
                      "'/plan-a-visit',\n    '/recovery-support-lowell',",
                      1,
                  )
              else:
                  raise RuntimeError("Unable to find sitemap insertion point")
              write(sitemap_path, sitemap)

          gift_api_path = "apps/church-hub/app/api/gifts/route.ts"
          gift_api = read(gift_api_path)
          gift_api = gift_api.replace(
              'moderation_status: "approved",',
              'moderation_status: "pending",',
          )
          if "moderation_status,risk_level" not in gift_api:
              gift_api = gift_api.replace(
                  "availability_text,status,created_at",
                  "availability_text,status,moderation_status,risk_level,created_at",
              )
          if "moderationStatus:" not in gift_api:
              gift_api = gift_api.replace(
                  "status: String(row.status),\n      responses:",
                  'status: String(row.status),\n      moderationStatus: String(row.moderation_status ?? "pending"),\n      riskLevel: String(row.risk_level ?? "standard"),\n      responses:',
              )
          write(gift_api_path, gift_api)

          gifts_component_path = "apps/church-hub/components/gifts-of-church.tsx"
          gifts_component = read(gifts_component_path)
          if "moderationStatus?:" not in gifts_component:
              gifts_component = gifts_component.replace(
                  'status: "open" | "matched" | "fulfilled" | "closed";\n  responses:',
                  'status: "open" | "matched" | "fulfilled" | "closed";\n  moderationStatus?: "pending" | "approved" | "rejected" | "removed";\n  riskLevel?: "standard" | "review" | "restricted";\n  responses:',
                  1,
              )
          if 'moderationStatus: mode === "showcase"' not in gifts_component:
              gifts_component = gifts_component.replace(
                  'status: "open",\n      responses: [],',
                  'status: "open",\n      moderationStatus: mode === "showcase" ? "approved" : "pending",\n      riskLevel: exchangeType === "paid" || type === "item_share" ? "review" : "standard",\n      responses: [],',
                  1,
              )
          gifts_component = gifts_component.replace(
              'setNotice("Your post is now available in the approved church gift board.");',
              'setNotice(\n        mode === "showcase"\n          ? "Your post is now available in the interactive gift board."\n          : "Your post was submitted for church moderation. It becomes visible to other members only after approval.",\n      );',
          )
          gifts_component = gifts_component.replace(
              "<b>{post.exchangeType}</b>",
              '<b>{post.moderationStatus === "pending" ? "pending review" : post.exchangeType}</b>',
          )
          write(gifts_component_path, gifts_component)

          gate_path = "apps/church-hub/components/recovery-ministry-gate.tsx"
          gate = read(gate_path)
          if "const publicSiteUrl" not in gate:
              gate = gate.replace(
                  'const [notice, setNotice] = useState("");',
                  'const [notice, setNotice] = useState("");\n  const publicSiteUrl =\n    process.env.NEXT_PUBLIC_PUBLIC_SITE_URL ?? "http://localhost:3000";',
                  1,
              )
          gate = gate.replace(
              'href="http://localhost:3000/recovery-support-lowell"',
              'href={`${publicSiteUrl}/recovery-support-lowell`}',
          )
          write(gate_path, gate)

          more_path = "apps/church-hub/app/(protected)/more/page.tsx"
          more = read(more_path)
          more = more.replace(
              'import { hasPermission } from "@church/authorization";',
              'import { hasPermission, type Permission } from "@church/authorization";',
          )
          if "const adminPermissions: Permission[]" not in more:
              more = more.replace("  const canAdmin = [", "  const adminPermissions: Permission[] = [")
              more = more.replace(
                  '  ].some((permission) => hasPermission(viewer.roles, permission as never));',
                  '  ];\n  const canAdmin = adminPermissions.some((permission) =>\n    hasPermission(viewer.roles, permission),\n  );',
              )
          write(more_path, more)

          hub_css_path = "apps/church-hub/app/ministry-expansion.css"
          hub_extra = read(".github/ministry-finalize-v2/hub-extra.css")
          append_once(hub_css_path, ".ministry-navigator__toggle", hub_extra)

          append_once(
              ".env.example",
              "NEXT_PUBLIC_RECOVERY_MINISTRY_NAME",
              """
          # Gifts, Prayer Well, and Recovery Ministry
          NEXT_PUBLIC_SPIRITUAL_GIFTS_ASSESSMENT_URL=
          NEXT_PUBLIC_RECOVERY_MINISTRY_NAME=Recovery Ministry
          RECOVERY_OFFICIAL_PROGRAM_CONFIRMED=false
          NEXT_PUBLIC_RECOVERY_MEETING_DAY=Sunday
          NEXT_PUBLIC_RECOVERY_MEETING_TIME=
          NEXT_PUBLIC_RECOVERY_PUBLIC_LOCATION=Lowell, Massachusetts
          """,
          )

          readme_section = """
          ## Gifts, Prayer Well, and Recovery Ministry

          The Church Hub includes three privacy-aware ministry systems:

          - **Gifts of the Church** — member-controlled spiritual-gift summaries, practical skills, moderated offers/needs/item sharing, private responses, and explainable matching.
          - **Prayer Well** — audience-controlled prayer requests, anonymous display, prayed/encouragement/update events, answered-prayer records, and separate pastoral/safeguarding routing.
          - **Recovery Ministry** — leader-approved private access, participant weekly journey, private group communication, curriculum links, leader operations, public treatment resources, and a separate public/aggregate Recovery Outreach workstation.

          See `docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md` for data boundaries, deployment gates, and operational ownership.
          """
          append_once("README.md", "## Gifts, Prayer Well, and Recovery Ministry", readme_section)

          verify_path = "scripts/verify-structure.mjs"
          verify = read(verify_path)
          required_paths = [
              "apps/church-hub/app/(protected)/gifts/page.tsx",
              "apps/church-hub/app/(protected)/prayer/page.tsx",
              "apps/church-hub/app/(protected)/recovery/page.tsx",
              "apps/church-hub/app/(protected)/more/page.tsx",
              "apps/church-hub/app/(protected)/admin/gifts/page.tsx",
              "apps/church-hub/app/(protected)/admin/prayer/page.tsx",
              "apps/church-hub/app/(protected)/admin/recovery/page.tsx",
              "apps/outreach-command/app/(protected)/recovery-outreach/page.tsx",
              "apps/public-web/app/recovery-support-lowell/page.tsx",
              "supabase/migrations/0027_gifts_prayer_recovery_ministries.sql",
              "supabase/migrations/0028_recovery_access_moderation_and_public_interest.sql",
              "supabase/migrations/0029_ministry_operational_indexes_and_prayer_routing.sql",
              "supabase/migrations/0030_recovery_access_option_rpc.sql",
              "supabase/migrations/0031_fix_gift_risk_classification.sql",
              "docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md",
              "docs/RELEASE_CHECKLIST_GIFTS_PRAYER_RECOVERY.md",
          ]
          if "0027_gifts_prayer_recovery_ministries" not in verify:
              insertion = "\n".join(f"  {path!r}," for path in required_paths)
              verify = verify.replace("const required = [", f"const required = [\n{insertion}", 1)
              write(verify_path, verify)

          playwright_path = "playwright.config.ts"
          playwright = read(playwright_path)
          playwright = playwright.replace(
              'env: { NEXT_PUBLIC_ENABLE_DEMO: "true" },',
              'env: {\n        NEXT_PUBLIC_ENABLE_DEMO: "true",\n        ALLOW_LOCAL_PREVIEW_MODE: "true",\n      },',
          )
          write(playwright_path, playwright)

          db_test_path = "supabase/tests/0008_gifts_prayer_recovery_ministries.test.sql"
          db_test = read(db_test_path).replace("select plan(29);", "select plan(33);")
          write(db_test_path, db_test)
          PY

      - name: Remove temporary completion artifacts
        shell: bash
        run: |
          rm -f scripts/apply-gifts-prayer-recovery-completion.mjs
          rm -f scripts/finalize-ministry-expansion-v2.mjs
          rm -f .github/workflows/temporary-finish-gifts-prayer-recovery.yml
          rm -rf .github/ministry-finalize-v2
          rm -f .github/workflows/temporary-ministry-finalize-v2.yml

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Verify required structure
        run: pnpm verify:structure

      - name: Commit finalized ministry expansion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: finalize Gifts Prayer and Recovery ministry platform"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
