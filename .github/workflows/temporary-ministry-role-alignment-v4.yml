name: Temporary Ministry Role Alignment V4

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  align:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'security: harden ministry APIs and confidential workflows')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out hardened branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Align application roles with database policies
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          recovery_page_path = "apps/church-hub/app/(protected)/recovery/page.tsx"
          recovery_page = read(recovery_page_path)
          if 'from "@/lib/recovery/leadership"' not in recovery_page:
              recovery_page = recovery_page.replace(
                  'import { requireViewer } from "@/lib/auth/viewer";',
                  'import { requireViewer } from "@/lib/auth/viewer";\nimport { isRecoveryLeader } from "@/lib/recovery/leadership";',
              )
          recovery_page = re.sub(
              r"  const canLead =\n(?:    .*\n){1,6}?    hasPermission\(viewer\.roles, \"safeguarding\.review\"\);",
              "  const canLead = await isRecoveryLeader(viewer.id, viewer.roles, viewer.demo);",
              recovery_page,
              count=1,
          )
          write(recovery_page_path, recovery_page)

          admin_recovery_page_path = "apps/church-hub/app/(protected)/admin/recovery/page.tsx"
          admin_recovery_page = read(admin_recovery_page_path)
          admin_recovery_page = admin_recovery_page.replace(
              'import { hasPermission } from "@church/authorization";\n',
              "",
          )
          if 'from "@/lib/recovery/leadership"' not in admin_recovery_page:
              admin_recovery_page = admin_recovery_page.replace(
                  'import { requireViewer } from "@/lib/auth/viewer";',
                  'import { requireViewer } from "@/lib/auth/viewer";\nimport { isRecoveryLeader } from "@/lib/recovery/leadership";',
              )
          admin_recovery_page = re.sub(
              r"  const canManage =\n(?:    .*\n){1,6}?    hasPermission\(viewer\.roles, \"moderation\.review\"\);",
              "  const canManage = await isRecoveryLeader(viewer.id, viewer.roles, viewer.demo);",
              admin_recovery_page,
              count=1,
          )
          if "viewer.aal" not in admin_recovery_page:
              admin_recovery_page = admin_recovery_page.replace(
                  '  if (!canManage) redirect("/this-week?error=forbidden");',
                  '  if (!canManage) redirect("/this-week?error=forbidden");\n  if (!viewer.demo && viewer.aal !== "aal2") {\n    redirect(`/mfa?next=${encodeURIComponent("/admin/recovery")}`);\n  }',
              )
          write(admin_recovery_page_path, admin_recovery_page)

          prayer_page_path = "apps/church-hub/app/(protected)/prayer/page.tsx"
          prayer_page = read(prayer_page_path)
          prayer_page = prayer_page.replace(
              'import { hasPermission } from "@church/authorization";\n',
              "",
          )
          prayer_page = re.sub(
              r"  const canLead =\n(?:    .*\n){1,6}?    hasPermission\(viewer\.roles, \"content\.publish\"\);",
              '  const canLead = viewer.roles.some((role) =>\n    ["minister", "safety_admin", "super_admin"].includes(role),\n  );',
              prayer_page,
              count=1,
          )
          write(prayer_page_path, prayer_page)

          admin_prayer_page_path = "apps/church-hub/app/(protected)/admin/prayer/page.tsx"
          admin_prayer_page = read(admin_prayer_page_path)
          admin_prayer_page = admin_prayer_page.replace(
              'import { hasPermission } from "@church/authorization";\n',
              "",
          )
          admin_prayer_page = re.sub(
              r"  const canReview =\n(?:    .*\n){1,6}?    hasPermission\(viewer\.roles, \"content\.publish\"\);",
              '  const canReview = viewer.roles.some((role) =>\n    ["minister", "safety_admin", "super_admin"].includes(role),\n  );',
              admin_prayer_page,
              count=1,
          )
          if "viewer.aal" not in admin_prayer_page:
              admin_prayer_page = admin_prayer_page.replace(
                  '  if (!canReview) redirect("/this-week?error=forbidden");',
                  '  if (!canReview) redirect("/this-week?error=forbidden");\n  if (!viewer.demo && viewer.aal !== "aal2") {\n    redirect(`/mfa?next=${encodeURIComponent("/admin/prayer")}`);\n  }',
              )
          write(admin_prayer_page_path, admin_prayer_page)

          admin_prayer_api_path = "apps/church-hub/app/api/admin/prayer/route.ts"
          admin_prayer_api = read(admin_prayer_api_path)
          admin_prayer_api = admin_prayer_api.replace(
              'import { hasPermission } from "@church/authorization";\n',
              "",
          )
          admin_prayer_api = re.sub(
              r"async function authorizedViewer\(\) \{.*?\n\}",
              '''async function authorizedViewer() {
  const viewer = await getViewer();
  if (!viewer || viewer.demo || viewer.aal !== "aal2") return null;
  return viewer.roles.some((role) =>
    ["minister", "safety_admin", "super_admin"].includes(role),
  )
    ? viewer
    : null;
}''',
              admin_prayer_api,
              count=1,
              flags=re.S,
          )
          write(admin_prayer_api_path, admin_prayer_api)

          admin_recovery_api_path = "apps/church-hub/app/api/admin/recovery/route.ts"
          admin_recovery_api = read(admin_recovery_api_path)
          admin_recovery_api = admin_recovery_api.replace(
              'import { hasPermission } from "@church/authorization";\n',
              "",
          )
          admin_recovery_api = re.sub(
              r"async function authorizedViewer\(\) \{.*?\n\}",
              '''async function authorizedViewer() {
  const viewer = await getViewer();
  if (!viewer || viewer.demo || viewer.aal !== "aal2") return null;
  if (viewer.roles.some((role) =>
    ["minister", "safety_admin", "super_admin"].includes(role),
  )) return viewer;
  const client = dynamicClient(await createClient());
  const { data, error } = await client
    .from("recovery_memberships")
    .select("id")
    .eq("profile_id", viewer.id)
    .in("membership_role", ["leader", "admin"])
    .is("ended_at", null)
    .limit(1)
    .maybeSingle();
  return !error && data ? viewer : null;
}''',
              admin_recovery_api,
              count=1,
              flags=re.S,
          )
          create_marker = 'if (action === "create_program") {'
          if "Only an MFA-verified minister" not in admin_recovery_api:
              admin_recovery_api = admin_recovery_api.replace(
                  create_marker,
                  create_marker + '''
      if (!viewer.roles.some((role) =>
        ["minister", "safety_admin", "super_admin"].includes(role),
      )) {
        throw new Error("Only an MFA-verified minister or safety administrator may create a recovery program.");
      }''',
                  1,
              )
          write(admin_recovery_api_path, admin_recovery_api)

          recovery_api_path = "apps/church-hub/app/api/recovery/route.ts"
          recovery_api = read(recovery_api_path)
          if "Only a recovery leader may publish announcements" not in recovery_api:
              recovery_api = recovery_api.replace(
                  'const leaderOnly = row.leaderOnly === true;\n      if (leaderOnly && !canLead) throw new Error("Leader access is required.");',
                  'const leaderOnly = row.leaderOnly === true;\n      if (\n        !canLead &&\n        (leaderOnly || type === "announcement" || type === "meeting_update")\n      ) {\n        throw new Error(\n          "Only a recovery leader may publish announcements, meeting updates, or leader-only posts.",\n        );\n      }',
              )
          write(recovery_api_path, recovery_api)

          verify_path = "scripts/verify-structure.mjs"
          verify = read(verify_path)
          additions = [
              "supabase/migrations/0033_tighten_gift_assessment_and_recovery_policies.sql",
              "supabase/tests/0009_ministry_policy_hardening.test.sql",
              "apps/church-hub/lib/recovery/leadership.ts",
          ]
          if "0033_tighten_gift_assessment" not in verify:
              insertion = "\n".join(f"  {path!r}," for path in additions)
              verify = verify.replace("const required = [", f"const required = [\n{insertion}", 1)
              write(verify_path, verify)

          docs_path = "docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md"
          docs = read(docs_path).replace("Migrations 0027–0032", "Migrations 0027–0033")
          write(docs_path, docs)
          PY

      - name: Remove role-alignment workflow
        run: rm -f .github/workflows/temporary-ministry-role-alignment-v4.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit role alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: align ministry roles with database policies"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
