name: Temporary Public Submission Formatter

on:
  push:
    branches:
      - feature/connected-ministry-journey

permissions:
  contents: write

concurrency:
  group: temporary-format-public-submissions
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out connected journey branch
        uses: actions/checkout@v4
        with:
          ref: feature/connected-ministry-journey
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format public submission utilities
        run: pnpm exec prettier --write apps/public-web/lib/public-submissions.ts

      - name: Commit formatted utility
        shell: bash
        run: |
          if git diff --quiet -- apps/public-web/lib/public-submissions.ts; then
            echo "Formatting is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/public-web/lib/public-submissions.ts
          git commit -m "chore: format public submission utilities"
          git push origin HEAD:feature/connected-ministry-journey
