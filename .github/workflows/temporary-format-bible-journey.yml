name: Temporary Bible Journey Formatter

on:
  push:
    branches:
      - feature/fellowship-bible-connection-hub

permissions:
  contents: write

concurrency:
  group: temporary-format-bible-journey
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fellowship-bible-connection-hub
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Bible journey component
        run: pnpm exec prettier --write apps/church-hub/components/bible-journey.tsx

      - name: Commit formatted component
        shell: bash
        run: |
          if git diff --quiet -- apps/church-hub/components/bible-journey.tsx; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/church-hub/components/bible-journey.tsx
          git commit -m "chore: format Bible journey component"
          git push origin HEAD:feature/fellowship-bible-connection-hub
