name: Temporary Database Type Generator

on:
  push:
    branches:
      - feature/outreach-intelligence-os

permissions:
  contents: write

concurrency:
  group: temporary-generate-database-types
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Outreach branch
        uses: actions/checkout@v4
        with:
          ref: feature/outreach-intelligence-os
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start and reset local Supabase
        run: |
          pnpm supabase:start
          pnpm supabase:reset

      - name: Generate schema-derived TypeScript contracts
        run: pnpm supabase:types

      - name: Commit generated database types
        shell: bash
        run: |
          if git diff --quiet -- packages/database/src/generated.types.ts; then
            echo "Generated types were already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/generated.types.ts
          git commit -m "chore: regenerate database types for Outreach Intelligence OS"
          git push origin HEAD:feature/outreach-intelligence-os

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop --no-backup || true
