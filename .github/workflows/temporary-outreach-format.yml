name: Temporary Outreach Formatter

on:
  push:
    branches:
      - feature/outreach-intelligence-os

permissions:
  contents: write

concurrency:
  group: temporary-outreach-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Outreach feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/outreach-intelligence-os
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format Outreach Intelligence OS"
          git push origin HEAD:feature/outreach-intelligence-os
