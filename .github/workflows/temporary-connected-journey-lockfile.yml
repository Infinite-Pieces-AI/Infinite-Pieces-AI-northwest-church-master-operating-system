name: Temporary Connected Journey Lockfile Refresh

on:
  push:
    branches:
      - feature/connected-ministry-journey

permissions:
  contents: write

concurrency:
  group: temporary-connected-journey-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out connected journey branch
        uses: actions/checkout@v4
        with:
          ref: feature/connected-ministry-journey
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh connected journey lockfile"
          git push origin HEAD:feature/connected-ministry-journey
