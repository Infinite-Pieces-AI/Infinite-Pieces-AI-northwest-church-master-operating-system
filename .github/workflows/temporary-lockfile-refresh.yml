name: Temporary Lockfile Refresh

on:
  push:
    branches:
      - feature/fellowship-bible-connection-hub

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fellowship-bible-connection-hub
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh dependency lock
        run: pnpm install --no-frozen-lockfile

      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No lockfile update was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: align ESLint dependency lock"
          git push origin HEAD:feature/fellowship-bible-connection-hub
