name: Temporary Connected Journey Typecheck Diagnostics

on:
  push:
    branches:
      - feature/connected-ministry-journey

permissions:
  contents: read

concurrency:
  group: temporary-connected-journey-typecheck-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out connected journey branch
        uses: actions/checkout@v4
        with:
          ref: feature/connected-ministry-journey

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture typecheck diagnostics
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          status=$?
          printf '%s\n' "$status" > typecheck-exit-code.txt
          cat typecheck.log
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: connected-journey-typecheck-diagnostics
          path: |
            typecheck.log
            typecheck-exit-code.txt
          if-no-files-found: error
          retention-days: 1
