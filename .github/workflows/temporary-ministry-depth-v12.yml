name: Temporary Ministry Operational Depth V12

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  finish-operational-depth:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'security: finish role-aware ministry administration UX')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out role-aware branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Complete gift responses, prayer privacy UX, and recovery leader planning
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          # -------------------------------------------------------------------
          # Gifts: private responses, owner decisions, and fulfillment lifecycle
          # -------------------------------------------------------------------
          gifts_api_path = "apps/church-hub/app/api/gifts/route.ts"
          gifts_api = read(gifts_api_path)
          if "const giftResponseStatuses" not in gifts_api:
              gifts_api = gifts_api.replace(
                  'const exchangeTypes = new Set(["free", "donation", "borrow", "exchange", "paid"]);',
                  'const exchangeTypes = new Set(["free", "donation", "borrow", "exchange", "paid"]);\nconst giftResponseStatuses = new Set([\n  "interested",\n  "accepted",\n  "declined",\n  "completed",\n  "withdrawn",\n]);\nconst giftPostStatuses = new Set(["open", "matched", "fulfilled", "closed"]);',
              )
          if 'action === "update_response"' not in gifts_api:
              gifts_api = gifts_api.replace(
                  '''} else {
      return NextResponse.json({ message: "Unsupported action." }, { status: 400 });
    }''',
                  '''} else if (action === "update_response") {
      const status = text(row.status, 30, true);
      if (!giftResponseStatuses.has(status)) {
        throw new Error("Unsupported response status.");
      }
      const { error } = await client
        .from("gift_post_responses")
        .update({ status })
        .eq("id", text(row.responseId, 80, true));
      if (error) throw error;
    } else if (action === "update_post_status") {
      const status = text(row.status, 30, true);
      if (!giftPostStatuses.has(status)) {
        throw new Error("Unsupported gift-post status.");
      }
      const { error } = await client
        .from("gift_posts")
        .update({ status })
        .eq("id", text(row.postId, 80, true));
      if (error) throw error;
    } else {
      return NextResponse.json({ message: "Unsupported action." }, { status: 400 });
    }''',
                  1,
              )
          write(gifts_api_path, gifts_api)

          gifts_component_path = "apps/church-hub/components/gifts-of-church.tsx"
          gifts = read(gifts_component_path)
          if "async function updateResponseStatus" not in gifts:
              gifts = gifts.replace(
                  "  async function updateScore(score: GiftScore, nextValue: number) {",
                  '''  async function updateResponseStatus(
    post: GiftPost,
    response: GiftResponse,
    status: GiftResponse["status"],
  ) {
    try {
      if (mode === "showcase") {
        setPosts((current) =>
          current.map((row) =>
            row.id === post.id
              ? {
                  ...row,
                  responses: row.responses.map((entry) =>
                    entry.id === response.id ? { ...entry, status } : entry,
                  ),
                }
              : row,
          ),
        );
      } else {
        await sendLive("update_response", { responseId: response.id, status });
      }
      setNotice(`Private response marked ${status}.`);
    } catch (error) {
      setNotice(
        error instanceof Error ? error.message : "The private response could not be updated.",
      );
    }
  }

  async function updatePostStatus(
    post: GiftPost,
    status: GiftPost["status"],
  ) {
    try {
      if (mode === "showcase") {
        setPosts((current) =>
          current.map((row) => (row.id === post.id ? { ...row, status } : row)),
        );
      } else {
        await sendLive("update_post_status", { postId: post.id, status });
      }
      setNotice(`Gift post marked ${status}.`);
    } catch (error) {
      setNotice(error instanceof Error ? error.message : "The gift post could not be updated.");
    }
  }

  async function updateScore(score: GiftScore, nextValue: number) {''',
                  1,
              )
          footer_pattern = re.compile(
              r'''<footer>\s*<button type="button" onClick=\{\(\) => void respond\(post\)\}>\s*Respond privately\s*</button>\s*<small>\{post\.responses\.length\} response\{post\.responses\.length === 1 \? "" : "s"\}</small>\s*</footer>''',
              re.S,
          )
          replacement = '''<footer>
                  <button type="button" onClick={() => void respond(post)}>
                    Respond privately
                  </button>
                  <small>
                    {post.responses.length} response{post.responses.length === 1 ? "" : "s"}
                  </small>
                </footer>
                {post.ownerName === "You" ? (
                  <div className="gift-post-owner-actions">
                    <button type="button" onClick={() => void updatePostStatus(post, "matched")}>
                      Mark matched
                    </button>
                    <button type="button" onClick={() => void updatePostStatus(post, "fulfilled")}>
                      Mark fulfilled
                    </button>
                    <button type="button" onClick={() => void updatePostStatus(post, "closed")}>
                      Close post
                    </button>
                  </div>
                ) : null}
                {post.responses.length ? (
                  <details className="gift-response-panel">
                    <summary>View private responses</summary>
                    {post.responses.map((response) => (
                      <article key={response.id}>
                        <div>
                          <strong>{response.profileName}</strong>
                          <span>{response.status}</span>
                        </div>
                        <p>{response.message}</p>
                        {post.ownerName === "You" ? (
                          <div>
                            <button
                              type="button"
                              onClick={() => void updateResponseStatus(post, response, "accepted")}
                            >
                              Accept
                            </button>
                            <button
                              type="button"
                              onClick={() => void updateResponseStatus(post, response, "declined")}
                            >
                              Decline
                            </button>
                            <button
                              type="button"
                              onClick={() => void updateResponseStatus(post, response, "completed")}
                            >
                              Complete
                            </button>
                          </div>
                        ) : response.profileName === "You" && response.status === "interested" ? (
                          <button
                            type="button"
                            onClick={() => void updateResponseStatus(post, response, "withdrawn")}
                          >
                            Withdraw response
                          </button>
                        ) : null}
                      </article>
                    ))}
                  </details>
                ) : null}'''
          gifts, substitutions = footer_pattern.subn(replacement, gifts, count=1)
          if substitutions != 1:
              raise RuntimeError("Unable to replace Gifts response footer")
          write(gifts_component_path, gifts)

          # -------------------------------------------------------------------
          # Prayer: restricted requests stay out of the ordinary feed in preview
          # and cannot offer member interaction controls.
          # -------------------------------------------------------------------
          prayer_component_path = "apps/church-hub/components/prayer-well-complete.tsx"
          prayer = read(prayer_component_path)
          prayer = prayer.replace(
              'if (tab === "feed" && request.status !== "open") return false;',
              'if (\n        tab === "feed" &&\n        (request.status !== "open" || request.sensitivity !== "normal")\n      ) {\n        return false;\n      }',
          )
          prayer = prayer.replace(
              'allowEncouragement: data.get("allowEncouragement") === "on", allowPrayed: data.get("allowPrayed") === "on",',
              'allowEncouragement:\n        sensitivity === "normal" && data.get("allowEncouragement") === "on",\n      allowPrayed: sensitivity === "normal" && data.get("allowPrayed") === "on",',
          )
          write(prayer_component_path, prayer)

          # -------------------------------------------------------------------
          # Recovery: program-specific live data plus facilitator guide publishing
          # -------------------------------------------------------------------
          recovery_component_path = "apps/church-hub/components/recovery-ministry.tsx"
          recovery = read(recovery_component_path)
          if "leaderAgenda?: string;" not in recovery:
              recovery = recovery.replace(
                  "progress: ProgressStatus;\n}",
                  "progress: ProgressStatus;\n  leaderAgenda?: string;\n  safetyNotes?: string;\n}",
                  1,
              )
          if "programId?: string;" not in recovery:
              recovery = recovery.replace(
                  "officialProgramConfirmed,\n}: {\n  mode: \"showcase\" | \"live\";",
                  "officialProgramConfirmed,\n  programId,\n}: {\n  mode: \"showcase\" | \"live\";",
                  1,
              )
              recovery = recovery.replace(
                  "officialProgramConfirmed: boolean;\n}) {",
                  "officialProgramConfirmed: boolean;\n  programId?: string;\n}) {",
                  1,
              )
          if "const [programDetails" not in recovery:
              recovery = recovery.replace(
                  'const [guideQuestion, setGuideQuestion] = useState("");',
                  '''const [guideQuestion, setGuideQuestion] = useState("");
  const [programDetails, setProgramDetails] = useState({
    meetingDay: "Sunday",
    meetingTime: "08:30",
    generalLocation: "Approved participants receive exact room directions privately.",
  });''',
                  1,
              )
          recovery = recovery.replace(
              'const response = await fetch("/api/recovery", { cache: "no-store" });',
              'const query = programId ? `?programId=${encodeURIComponent(programId)}` : "";\n      const response = await fetch(`/api/recovery${query}`, { cache: "no-store" });',
          )
          if "setProgramDetails" in recovery and "payload.program?.meetingDay" not in recovery:
              recovery = recovery.replace(
                  "setMembershipRole(payload.membershipRole ?? null);",
                  '''setMembershipRole(payload.membershipRole ?? null);
      if (payload.program) {
        setProgramDetails({
          meetingDay: payload.program.meetingDay ?? "Meeting",
          meetingTime: payload.program.meetingTime ?? "",
          generalLocation:
            payload.program.generalLocation ??
            "Approved participants receive exact room directions privately.",
        });
      }''',
                  1,
              )
          recovery = recovery.replace(
              "body: JSON.stringify({ action, ...payload }),",
              "body: JSON.stringify({ action, programId, ...payload }),",
              1,
          )
          if "leaderAgenda:" not in recovery.split("async function createSession", 1)[1].split("};", 1)[0]:
              recovery = recovery.replace(
                  'scheduledFor: String(data.get("scheduledFor") ?? "") || undefined,\n      status:',
                  'scheduledFor: String(data.get("scheduledFor") ?? "") || undefined,\n      leaderAgenda: String(data.get("leaderAgenda") ?? "").trim(),\n      safetyNotes: String(data.get("safetyNotes") ?? "").trim() || undefined,\n      status:',
                  1,
              )
          recovery = recovery.replace(
              '<p>Sunday gathering</p><h3>8:30 AM before worship</h3><span>Approved participants receive exact room directions privately.</span>',
              '<p>{programDetails.meetingDay} gathering</p><h3>{formatRecoveryTime(programDetails.meetingTime)}</h3><span>{programDetails.generalLocation}</span>',
          )
          if 'name="leaderAgenda"' not in recovery:
              recovery = recovery.replace(
                  '<label>Scheduled date/time<input name="scheduledFor" type="datetime-local" /></label>\n            <button type="submit">Publish participant guide</button>',
                  '''<label>Scheduled date/time<input name="scheduledFor" type="datetime-local" /></label>
            <label className="span-2">Facilitator agenda<textarea name="leaderAgenda" rows={8} required minLength={10} maxLength={10000} placeholder="Welcome, confidentiality reminder, teaching flow, discussion prompts, next-step plan, and close." /></label>
            <label className="span-2">Safety and referral notes<textarea name="safetyNotes" rows={5} maxLength={5000} placeholder="Current emergency boundary, treatment-resource reminders, and issues requiring a private leader follow-up." /></label>
            <button type="submit">Publish participant guide and leader agenda</button>''',
                  1,
              )
          if "leader-session-plans" not in recovery:
              recovery = recovery.replace(
                  '</form>\n          <aside className="leader-checklist">',
                  '''</form>
          <div className="leader-session-plans">
            <h3>Published facilitator plans</h3>
            {sessions
              .filter((session) => session.leaderAgenda)
              .map((session) => (
                <article key={session.id}>
                  <span>Week {session.week}</span>
                  <strong>{session.title}</strong>
                  <p>{session.leaderAgenda}</p>
                  {session.safetyNotes ? <small>{session.safetyNotes}</small> : null}
                </article>
              ))}
          </div>
          <aside className="leader-checklist">''',
                  1,
              )
          if "function formatRecoveryTime" not in recovery:
              recovery += '''

function formatRecoveryTime(value: string): string {
  if (!value) return "Time shared by the leader";
  const [hourText, minuteText = "00"] = value.split(":");
  const hour = Number(hourText);
  if (!Number.isFinite(hour)) return value;
  const suffix = hour >= 12 ? "PM" : "AM";
  const displayHour = hour % 12 || 12;
  return `${displayHour}:${minuteText.slice(0, 2)} ${suffix}`;
}
'''
          write(recovery_component_path, recovery)

          gate_path = "apps/church-hub/components/recovery-ministry-gate.tsx"
          gate = read(gate_path)
          gate = gate.replace(
              'officialProgramConfirmed={currentMembership.officialProgramConfirmation}\n        />',
              'officialProgramConfirmed={currentMembership.officialProgramConfirmation}\n          programId={currentMembership.id}\n        />',
          )
          write(gate_path, gate)

          recovery_api_path = "apps/church-hub/app/api/recovery/route.ts"
          recovery_api = read(recovery_api_path)
          recovery_api = recovery_api.replace(
              "async function membershipForViewer(client: SupabaseClient, viewerId: string) {",
              "async function membershipForViewer(\n  client: SupabaseClient,\n  viewerId: string,\n  programId?: string | null,\n) {",
          )
          old_membership_query = '''  const { data, error } = await client
    .from("recovery_memberships")
    .select("program_id,membership_role")
    .eq("profile_id", viewerId)
    .is("ended_at", null)
    .order("joined_at", { ascending: true })
    .limit(1)
    .maybeSingle();'''
          new_membership_query = '''  let query = client
    .from("recovery_memberships")
    .select("program_id,membership_role")
    .eq("profile_id", viewerId)
    .is("ended_at", null);
  if (programId) query = query.eq("program_id", programId);
  const { data, error } = await query
    .order("joined_at", { ascending: true })
    .limit(1)
    .maybeSingle();'''
          recovery_api = recovery_api.replace(old_membership_query, new_membership_query)
          recovery_api = recovery_api.replace(
              "async function loadPayload(client: SupabaseClient, viewerId: string) {\n  const membership = await membershipForViewer(client, viewerId);",
              "async function loadPayload(\n  client: SupabaseClient,\n  viewerId: string,\n  programId?: string | null,\n) {\n  const membership = await membershipForViewer(client, viewerId, programId);",
          )
          if "guideResult" not in recovery_api:
              recovery_api = recovery_api.replace(
                  "const postRows = (postResult.data ?? []) as Row[];",
                  '''const sessionRows = (sessionResult.data ?? []) as Row[];
  const sessionIds = sessionRows.map((session) => String(session.id));
  const guideResult = sessionIds.length
    ? await client
        .from("recovery_session_guides")
        .select("session_id,leader_agenda,safety_notes")
        .in("session_id", sessionIds)
    : { data: [], error: null };
  if (guideResult.error) throw guideResult.error;
  const guideMap = new Map(
    ((guideResult.data ?? []) as Row[]).map((guide) => [
      String(guide.session_id),
      guide,
    ]),
  );
  const postRows = (postResult.data ?? []) as Row[];''',
                  1,
              )
              recovery_api = recovery_api.replace(
                  "sessions: sessionRows.map((session) => ({",
                  "sessions: sessionRows.map((session) => {\n      const guide = guideMap.get(String(session.id));\n      return ({",
                  1,
              )
              recovery_api = recovery_api.replace(
                  'progress: progressMap.get(String(session.id)) ?? "not_started",\n    })),',
                  'progress: progressMap.get(String(session.id)) ?? "not_started",\n      leaderAgenda:\n        typeof guide?.leader_agenda === "string" ? guide.leader_agenda : undefined,\n      safetyNotes:\n        typeof guide?.safety_notes === "string" ? guide.safety_notes : undefined,\n    });\n    }),',
                  1,
              )
              recovery_api = recovery_api.replace(
                  "const sessionRows = (sessionResult.data ?? []) as Row[];\n  const progressMap",
                  "const progressMap",
                  1,
              )
          recovery_api = recovery_api.replace(
              "export async function GET() {",
              "export async function GET(request: Request) {",
          )
          recovery_api = recovery_api.replace(
              "return NextResponse.json(await loadPayload(client, viewer.id));",
              "const programId = new URL(request.url).searchParams.get(\"programId\");\n    return NextResponse.json(await loadPayload(client, viewer.id, programId));",
          )
          recovery_api = recovery_api.replace(
              "const membership = await membershipForViewer(client, viewer.id);",
              'const membership = await membershipForViewer(\n      client,\n      viewer.id,\n      text(row.programId, 80),\n    );',
          )
          session_insert_pattern = re.compile(
              r'''      const \{ error \} = await client\.from\("recovery_sessions"\)\.insert\(\{.*?      if \(error\) throw error;''',
              re.S,
          )
          session_rpc = '''      const { error } = await client.rpc("publish_recovery_session", {
        p_program_id: programId,
        p_series_key: "recovery_journey",
        p_week_number: week,
        p_title: text(row.title, 180, true),
        p_participant_summary: text(row.summary, 3000, true),
        p_scripture_references: stringList(row.scriptureReferences),
        p_licensed_resource_url: text(row.resourceUrl, 2000),
        p_scheduled_for: text(row.scheduledFor, 80),
        p_leader_agenda: text(row.leaderAgenda, 10000, true),
        p_safety_notes: text(row.safetyNotes, 5000),
      });
      if (error) throw error;'''
          recovery_api, rpc_count = session_insert_pattern.subn(session_rpc, recovery_api, count=1)
          if rpc_count != 1:
              raise RuntimeError("Unable to replace recovery session publishing with RPC")
          write(recovery_api_path, recovery_api)

          css_path = "apps/church-hub/app/ministry-expansion.css"
          css = read(css_path)
          if ".gift-response-panel" not in css:
              css += '''

.gift-post-owner-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}
.gift-post-owner-actions button,
.gift-response-panel button {
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid #bfd0d9;
  border-radius: 9px;
  color: var(--navy);
  background: white;
  cursor: pointer;
  font-weight: 800;
}
.gift-response-panel {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid #d1e0e6;
  border-radius: 12px;
  background: white;
}
.gift-response-panel summary { cursor: pointer; color: var(--blue); font-weight: 850; }
.gift-response-panel article { margin-top: 10px; padding: 11px; border-radius: 10px; background: #f4f8f9; }
.gift-response-panel article > div { display: flex; justify-content: space-between; gap: 10px; }
.gift-response-panel p { color: var(--muted); }
.leader-session-plans { display: grid; align-content: start; gap: 10px; }
.leader-session-plans > h3 { margin: 0; }
.leader-session-plans article { padding: 14px; border: 1px solid var(--border); border-radius: 13px; background: white; }
.leader-session-plans span,.leader-session-plans strong,.leader-session-plans small { display: block; }
.leader-session-plans span { color: #21735f; font-size: .67rem; font-weight: 900; text-transform: uppercase; }
.leader-session-plans p,.leader-session-plans small { color: var(--muted); line-height: 1.55; }
.recovery-leader-layout { grid-template-columns: minmax(0,1.3fr) minmax(260px,.7fr); }
.recovery-leader-layout .leader-session-plans { grid-column: 1; }
.recovery-leader-layout .leader-checklist { grid-column: 2; grid-row: 1 / span 2; }
@media(max-width:1050px){.recovery-leader-layout .leader-session-plans,.recovery-leader-layout .leader-checklist{grid-column:auto;grid-row:auto}}
'''
              write(css_path, css)

          verify_path = "scripts/verify-structure.mjs"
          verify = read(verify_path)
          additions = [
              "supabase/migrations/0035_transactional_recovery_session_publishing.sql",
              "supabase/tests/0011_recovery_session_publishing.test.sql",
          ]
          for item in additions:
              if item not in verify:
                  verify = verify.replace("const required = [", f"const required = [\n  {item!r},", 1)
          write(verify_path, verify)

          docs_path = "docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md"
          docs = read(docs_path).replace("Migrations 0027–0034", "Migrations 0027–0035")
          if "facilitator agenda" not in docs.lower():
              docs += "\n### Facilitator planning\n\nParticipant summaries and restricted facilitator agendas are published atomically. The leader agenda may include meeting flow, discussion prompts, confidentiality reminders, safety notes, and referral reminders. It is accessible only to MFA-verified recovery leaders.\n"
          write(docs_path, docs)
          PY

      - name: Remove temporary V12 workflow
        run: rm -f .github/workflows/temporary-ministry-depth-v12.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit operational depth completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete response management and recovery leader planning"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
