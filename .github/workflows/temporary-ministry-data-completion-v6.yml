name: Temporary Ministry Data Completion V6

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  complete:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'feat: finish member privacy and ministry sharing controls')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out privacy-polished branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Complete data and API behavior
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          gifts_api_path = "apps/church-hub/app/api/gifts/route.ts"
          gifts_api = read(gifts_api_path)
          gifts_api = re.sub(
              r'''\} else if \(action === "set_assessment_sharing"\) \{.*?\n    \} else if \(action === "create_post"\) \{''',
              '''} else if (action === "set_assessment_sharing") {
      const { error } = await client.from("gift_assessments").upsert(
        {
          profile_id: viewer.id,
          provider_key: "manual",
          share_summary_with_leaders: row.shared === true,
          completed_at: new Date().toISOString(),
        },
        { onConflict: "profile_id,provider_key" },
      );
      if (error) throw error;
    } else if (action === "create_post") {''',
              gifts_api,
              count=1,
              flags=re.S,
          )
          gifts_api = gifts_api.replace(
              '''if (
        postType === "church_need" &&
        !(
          hasPermission(viewer.roles, "content.draft") ||
          hasPermission(viewer.roles, "group.manage_assigned")
        )
      ) {''',
              '''if (
        postType === "church_need" &&
        !viewer.roles.some((role) =>
          ["group_leader", "minister", "super_admin"].includes(role),
        )
      ) {''',
          )
          write(gifts_api_path, gifts_api)

          prayer_api_path = "apps/church-hub/app/api/prayer-well-complete/route.ts"
          prayer_api = read(prayer_api_path)
          if "const memberVisibleRequests" not in prayer_api:
              prayer_api = prayer_api.replace(
                  "const ownedIds = new Set(\n    ((ownerResult.data ?? []) as Row[])\n      .filter((owner) => String(owner.profile_id) === viewerId)\n      .map((owner) => String(owner.request_id)),\n  );",
                  "const ownedIds = new Set(\n    ((ownerResult.data ?? []) as Row[])\n      .filter((owner) => String(owner.profile_id) === viewerId)\n      .map((owner) => String(owner.request_id)),\n  );\n  const memberVisibleRequests = requests.filter(\n    (request) =>\n      String(request.sensitivity) === \"normal\" ||\n      ownedIds.has(String(request.id)),\n  );",
              )
              prayer_api = prayer_api.replace(
                  "requests: requests.map((request) => ({",
                  "requests: memberVisibleRequests.map((request) => ({",
                  1,
              )
          write(prayer_api_path, prayer_api)

          outreach_api_path = "apps/outreach-command/app/api/recovery-outreach/route.ts"
          outreach_api = read(outreach_api_path)
          outreach_api = outreach_api.replace(
              'select("id,first_name,preferred_contact,requested_next_step,source_path,status,assigned_to,created_at")',
              'select("id,first_name,email,phone,preferred_contact,requested_next_step,message,source_path,status,assigned_to,consented_at,created_at")',
          )
          if 'email: typeof inquiry.email === "string"' not in outreach_api:
              outreach_api = outreach_api.replace(
                  "preferredContact: String(inquiry.preferred_contact),",
                  'preferredContact: String(inquiry.preferred_contact),\n    email: typeof inquiry.email === "string" ? inquiry.email : undefined,\n    phone: typeof inquiry.phone === "string" ? inquiry.phone : undefined,\n    message: typeof inquiry.message === "string" ? inquiry.message : undefined,\n    consentedAt:\n      typeof inquiry.consented_at === "string" ? inquiry.consented_at : undefined,',
                  1,
              )
          write(outreach_api_path, outreach_api)

          outreach_component_path = "apps/outreach-command/components/recovery-outreach-workspace.tsx"
          outreach_component = read(outreach_component_path)
          if "email?: string;" not in outreach_component:
              outreach_component = outreach_component.replace(
                  "preferredContact: string;",
                  "preferredContact: string;\n  email?: string;\n  phone?: string;\n  message?: string;\n  consentedAt?: string;",
                  1,
              )
          if "Contact detail" not in outreach_component:
              outreach_component = re.sub(
                  r'''(<div>\s*<dt>Contact preference</dt>\s*<dd>\{selectedInquiry\.preferredContact\}</dd>\s*</div>)''',
                  r'''\1
                  <div>
                    <dt>Contact detail</dt>
                    <dd>{selectedInquiry.email ?? selectedInquiry.phone ?? "Not supplied"}</dd>
                  </div>''',
                  outreach_component,
                  count=1,
              )
          if "selectedInquiry.message ?" not in outreach_component:
              outreach_component = outreach_component.replace(
                  "</dl>\n                <div>",
                  "</dl>\n                {selectedInquiry.message ? (\n                  <blockquote>{selectedInquiry.message}</blockquote>\n                ) : null}\n                <div>",
                  1,
              )
          write(outreach_component_path, outreach_component)

          old_route = Path("apps/church-hub/app/api/prayer-well/route.ts")
          if old_route.exists():
              old_route.unlink()
          PY

      - name: Remove data-completion workflow
        run: rm -f .github/workflows/temporary-ministry-data-completion-v6.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit completed data behavior
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete ministry data and follow-up behavior"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
