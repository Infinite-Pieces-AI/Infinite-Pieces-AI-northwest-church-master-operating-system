name: Temporary Ministry Member Privacy V5

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  polish:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'security: align ministry roles with database policies')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out aligned branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Apply member privacy and product polish
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          recovery_page_path = "apps/church-hub/app/(protected)/recovery/page.tsx"
          recovery_page = read(recovery_page_path)
          recovery_page = recovery_page.replace(
              "const canLead = await isRecoveryLeader(viewer.id, viewer.roles, viewer.demo);",
              "const canLead =\n    viewer.demo ||\n    (viewer.aal === \"aal2\" &&\n      (await isRecoveryLeader(viewer.id, viewer.roles, viewer.demo)));",
          )
          write(recovery_page_path, recovery_page)

          prayer_page_path = "apps/church-hub/app/(protected)/prayer/page.tsx"
          prayer_page = read(prayer_page_path)
          prayer_page = prayer_page.replace(
              'const canLead = viewer.roles.some((role) =>\n    ["minister", "safety_admin", "super_admin"].includes(role),\n  );',
              'const canLead =\n    viewer.demo ||\n    (viewer.aal === "aal2" &&\n      viewer.roles.some((role) =>\n        ["minister", "safety_admin", "super_admin"].includes(role),\n      ));',
          )
          write(prayer_page_path, prayer_page)

          recovery_api_path = "apps/church-hub/app/api/recovery/route.ts"
          recovery_api = read(recovery_api_path)
          recovery_api = recovery_api.replace(
              'const canLead = role === "leader" || role === "admin";',
              'const canLead =\n      viewer.aal === "aal2" && (role === "leader" || role === "admin");',
          )
          write(recovery_api_path, recovery_api)

          prayer_api_path = "apps/church-hub/app/api/prayer-well-complete/route.ts"
          prayer_api = read(prayer_api_path)
          if "const memberVisibleRequests" not in prayer_api:
              prayer_api = prayer_api.replace(
                  "const ownedIds = new Set(((ownerResult.data ?? []) as Row[]).filter((owner) => String(owner.profile_id) === viewerId).map((owner) => String(owner.request_id)));\n\n  return {",
                  "const ownedIds = new Set(\n    ((ownerResult.data ?? []) as Row[])\n      .filter((owner) => String(owner.profile_id) === viewerId)\n      .map((owner) => String(owner.request_id)),\n  );\n  const memberVisibleRequests = requests.filter(\n    (request) =>\n      String(request.sensitivity) === \"normal\" ||\n      ownedIds.has(String(request.id)),\n  );\n\n  return {",
              )
              prayer_api = prayer_api.replace(
                  "requests: requests.map((request) => ({",
                  "requests: memberVisibleRequests.map((request) => ({",
                  1,
              )
          write(prayer_api_path, prayer_api)

          gifts_api_path = "apps/church-hub/app/api/gifts/route.ts"
          gifts_api = read(gifts_api_path)
          gifts_api = gifts_api.replace(
              'select("id,provider_key,provider_report_url,dominant_theme,completed_at")',
              'select("id,provider_key,provider_report_url,dominant_theme,completed_at,share_summary_with_leaders")',
          )
          if "shareSummaryWithLeaders:" not in gifts_api:
              gifts_api = gifts_api.replace(
                  "providerReportUrl:\n      typeof assessmentRow?.provider_report_url === \"string\" ? assessmentRow.provider_report_url : null,",
                  "providerReportUrl:\n      typeof assessmentRow?.provider_report_url === \"string\"\n        ? assessmentRow.provider_report_url\n        : null,\n    shareSummaryWithLeaders: assessmentRow?.share_summary_with_leaders === true,",
              )
          if 'action === "set_assessment_sharing"' not in gifts_api:
              gifts_api = gifts_api.replace(
                  '} else if (action === "create_post") {',
                  '''} else if (action === "set_assessment_sharing") {
      const { error } = await client
        .from("gift_assessments")
        .update({ share_summary_with_leaders: row.shared === true })
        .eq("profile_id", viewer.id)
        .eq("provider_key", "manual");
      if (error) throw error;
    } else if (action === "create_post") {''',
                  1,
              )
          write(gifts_api_path, gifts_api)

          gifts_component_path = "apps/church-hub/components/gifts-of-church.tsx"
          gifts_component = read(gifts_component_path)
          if "shareSummaryWithLeaders?: boolean;" not in gifts_component:
              gifts_component = gifts_component.replace(
                  "providerReportUrl?: string | null;",
                  "providerReportUrl?: string | null;\n  shareSummaryWithLeaders?: boolean;",
              )
          if "const [shareSummaryWithLeaders" not in gifts_component:
              gifts_component = gifts_component.replace(
                  'const [guideQuestion, setGuideQuestion] = useState("");',
                  'const [guideQuestion, setGuideQuestion] = useState("");\n  const [shareSummaryWithLeaders, setShareSummaryWithLeaders] = useState(false);',
              )
          gifts_component = gifts_component.replace(
              "setPosts(parsed.posts);",
              "setPosts(parsed.posts);\n            setShareSummaryWithLeaders(parsed.shareSummaryWithLeaders === true);",
          )
          gifts_component = gifts_component.replace(
              "setPosts(payload.posts ?? []);",
              "setPosts(payload.posts ?? []);\n      setShareSummaryWithLeaders(payload.shareSummaryWithLeaders === true);",
          )
          gifts_component = gifts_component.replace(
              "JSON.stringify({ scores, posts } satisfies GiftsPayload)",
              "JSON.stringify({\n        scores,\n        posts,\n        shareSummaryWithLeaders,\n      } satisfies GiftsPayload)",
          )
          gifts_component = gifts_component.replace(
              "}, [mode, posts, scores]);",
              "}, [mode, posts, scores, shareSummaryWithLeaders]);",
          )
          if "async function updateAssessmentSharing" not in gifts_component:
              gifts_component = gifts_component.replace(
                  "async function updateScore(score: GiftScore, nextValue: number) {",
                  '''async function updateAssessmentSharing(shared: boolean) {
    setShareSummaryWithLeaders(shared);
    if (mode === "showcase") {
      setNotice(
        shared
          ? "Your assessment summary is now marked as shared with approved leaders in this browser showcase."
          : "Your assessment summary is private to you.",
      );
      return;
    }
    try {
      await sendLive("set_assessment_sharing", { shared });
      setNotice(
        shared
          ? "Approved ministers may now read your assessment summary."
          : "Your assessment summary is now private to you.",
      );
    } catch (error) {
      setShareSummaryWithLeaders(!shared);
      setNotice(
        error instanceof Error ? error.message : "The assessment-sharing preference could not be saved.",
      );
    }
  }

  async function updateScore(score: GiftScore, nextValue: number) {''',
                  1,
              )
          if "Share my assessment summary with approved ministers" not in gifts_component:
              gifts_component = gifts_component.replace(
                  '<div className="gift-score-list">',
                  '''<label className="gift-sharing-control">
            <input
              type="checkbox"
              checked={shareSummaryWithLeaders}
              onChange={(event) => void updateAssessmentSharing(event.target.checked)}
            />
            <span>
              <strong>Share my assessment summary with approved ministers</strong>
              <small>
                Off by default. This does not publish the report to other members or allow leaders to edit it.
              </small>
            </span>
          </label>
          <div className="gift-score-list">''',
                  1,
              )
          gifts_component = gifts_component.replace(
              "setPosts(previewPosts);\n    window.localStorage.removeItem(storageKey);",
              "setPosts(previewPosts);\n    setShareSummaryWithLeaders(false);\n    window.localStorage.removeItem(storageKey);",
          )
          write(gifts_component_path, gifts_component)

          gifts_page_path = "apps/church-hub/app/(protected)/gifts/page.tsx"
          gifts_page = read(gifts_page_path)
          gifts_page = gifts_page.replace(
              "const canLead =\n    hasPermission(viewer.roles, \"content.draft\") ||\n    hasPermission(viewer.roles, \"group.manage_assigned\") ||\n    hasPermission(viewer.roles, \"outreach.manage\");",
              'const canLead = viewer.roles.some((role) =>\n    ["group_leader", "minister", "super_admin"].includes(role),\n  );',
          )
          write(gifts_page_path, gifts_page)

          hub_css_path = "apps/church-hub/app/ministry-expansion.css"
          hub_css = read(hub_css_path)
          if ".gift-sharing-control" not in hub_css:
              hub_css += '''

.gift-sharing-control {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 0 0 18px;
  padding: 14px;
  border: 1px solid #c8dce6;
  border-radius: 13px;
  background: #f4f9fb;
}
.gift-sharing-control input { width: 18px; min-height: 18px; margin-top: 2px; }
.gift-sharing-control strong,.gift-sharing-control small { display: block; }
.gift-sharing-control small { margin-top: 4px; color: var(--muted); line-height: 1.45; }
'''
              write(hub_css_path, hub_css)
          PY

      - name: Remove member-privacy workflow
        run: rm -f .github/workflows/temporary-ministry-member-privacy-v5.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit member privacy polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish member privacy and ministry sharing controls"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
