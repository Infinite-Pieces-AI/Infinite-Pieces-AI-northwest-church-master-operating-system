name: Temporary Ministry Explicit Authorization V7

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  finalize-authorization:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'feat: complete ministry data and follow-up behavior')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out data-complete branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Replace role-sensitive pages with explicit final versions
        shell: bash
        run: |
          cp .github/ministry-finalize-v7/recovery-page.tsx 'apps/church-hub/app/(protected)/recovery/page.tsx'
          cp .github/ministry-finalize-v7/admin-recovery-page.tsx 'apps/church-hub/app/(protected)/admin/recovery/page.tsx'
          cp .github/ministry-finalize-v7/prayer-page.tsx 'apps/church-hub/app/(protected)/prayer/page.tsx'
          cp .github/ministry-finalize-v7/admin-prayer-page.tsx 'apps/church-hub/app/(protected)/admin/prayer/page.tsx'
          cp .github/ministry-finalize-v7/gifts-page.tsx 'apps/church-hub/app/(protected)/gifts/page.tsx'

      - name: Normalize generated documentation and environment examples
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          env_path = Path('.env.example')
          env = env_path.read_text(encoding='utf-8')
          env = re.sub(
              r'\n[ \t]+# Gifts, Prayer Well, and Recovery Ministry\n(?:[ \t]+(?:NEXT_PUBLIC_SPIRITUAL_GIFTS_ASSESSMENT_URL|NEXT_PUBLIC_RECOVERY_MINISTRY_NAME|RECOVERY_OFFICIAL_PROGRAM_CONFIRMED|NEXT_PUBLIC_RECOVERY_MEETING_DAY|NEXT_PUBLIC_RECOVERY_MEETING_TIME|NEXT_PUBLIC_RECOVERY_PUBLIC_LOCATION)=.*\n?)+',
              '\n' + textwrap.dedent('''
              # Gifts, Prayer Well, and Recovery Ministry
              NEXT_PUBLIC_SPIRITUAL_GIFTS_ASSESSMENT_URL=
              NEXT_PUBLIC_RECOVERY_MINISTRY_NAME=Recovery Ministry
              RECOVERY_OFFICIAL_PROGRAM_CONFIRMED=false
              NEXT_PUBLIC_RECOVERY_MEETING_DAY=Sunday
              NEXT_PUBLIC_RECOVERY_MEETING_TIME=
              NEXT_PUBLIC_RECOVERY_PUBLIC_LOCATION=Lowell, Massachusetts
              '''),
              env,
              count=1,
          )
          env_path.write_text(env, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          marker = '## Gifts, Prayer Well, and Recovery Ministry'
          if marker in readme:
              before, section = readme.split(marker, 1)
              next_heading = re.search(r'\n## ', section)
              if next_heading:
                  body = section[:next_heading.start()]
                  after = section[next_heading.start():]
              else:
                  body = section
                  after = ''
              body = textwrap.dedent(body).strip('\n')
              readme = before.rstrip() + '\n\n' + marker + '\n' + body + '\n' + after.lstrip('\n')
          readme_path.write_text(readme, encoding='utf-8')

          verify_path = Path('scripts/verify-structure.mjs')
          verify = verify_path.read_text(encoding='utf-8')
          required = [
              'supabase/migrations/0032_harden_prayer_updates_and_recovery_leader_mfa.sql',
              'supabase/migrations/0033_tighten_gift_assessment_and_recovery_policies.sql',
              'supabase/tests/0008_gifts_prayer_recovery_ministries.test.sql',
              'supabase/tests/0009_ministry_policy_hardening.test.sql',
              'apps/church-hub/lib/recovery/leadership.ts',
          ]
          for item in required:
              if item not in verify:
                  verify = verify.replace('const required = [', f"const required = [\n  {item!r},", 1)
          verify_path.write_text(verify, encoding='utf-8')

          docs_path = Path('docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md')
          docs = docs_path.read_text(encoding='utf-8').replace('Migrations 0027–0032', 'Migrations 0027–0033')
          docs_path.write_text(docs, encoding='utf-8')
          PY

      - name: Remove obsolete and temporary files
        shell: bash
        run: |
          rm -f apps/church-hub/components/prayer-well.tsx
          rm -rf .github/ministry-finalize-v7
          rm -f .github/workflows/temporary-ministry-explicit-authorization-v7.yml

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Verify required architecture
        run: pnpm verify:structure

      - name: Commit explicit authorization release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: finalize explicit ministry page authorization"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
