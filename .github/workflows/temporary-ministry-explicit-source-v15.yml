name: Temporary Ministry Explicit Source V15

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  install-explicit-source:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'feat: complete response management and recovery leader planning')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out operational-depth branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install explicit final Recovery source
        shell: bash
        run: |
          cp .github/ministry-finalize-v15/recovery-ministry.tsx apps/church-hub/components/recovery-ministry.tsx
          cp .github/ministry-finalize-v15/recovery-api.ts apps/church-hub/app/api/recovery/route.ts

      - name: Complete selected-program connection and release metadata
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          gate_path = Path('apps/church-hub/components/recovery-ministry-gate.tsx')
          gate = gate_path.read_text(encoding='utf-8')
          if 'programId={currentMembership.id}' not in gate:
              gate = gate.replace(
                  '          officialProgramConfirmed={currentMembership.officialProgramConfirmation}\n        />',
                  '          officialProgramConfirmed={currentMembership.officialProgramConfirmation}\n          programId={currentMembership.id}\n        />',
                  1,
              )
          if 'programId={currentMembership.id}' not in gate:
              raise RuntimeError('Recovery membership was not connected to the selected program')
          gate_path.write_text(gate, encoding='utf-8')

          css_path = Path('apps/church-hub/app/ministry-expansion.css')
          css = css_path.read_text(encoding='utf-8')
          if '.leader-session-plans' not in css:
              css += '''

.leader-session-plans { display:grid; align-content:start; gap:10px; }
.leader-session-plans>h3 { margin:0; }
.leader-session-plans article { padding:14px; border:1px solid var(--border); border-radius:13px; background:white; }
.leader-session-plans span,.leader-session-plans strong,.leader-session-plans small { display:block; }
.leader-session-plans span { color:#21735f; font-size:.67rem; font-weight:900; text-transform:uppercase; }
.leader-session-plans p,.leader-session-plans small { color:var(--muted); line-height:1.55; }
.recovery-leader-layout { grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr); }
.recovery-leader-layout .leader-session-plans { grid-column:1; }
.recovery-leader-layout .leader-checklist { grid-column:2; grid-row:1 / span 2; }
@media(max-width:1050px){.recovery-leader-layout .leader-session-plans,.recovery-leader-layout .leader-checklist{grid-column:auto;grid-row:auto}}
'''
          css_path.write_text(css, encoding='utf-8')

          verify_path = Path('scripts/verify-structure.mjs')
          verify = verify_path.read_text(encoding='utf-8')
          for item in [
              'supabase/migrations/0035_transactional_recovery_session_publishing.sql',
              'supabase/tests/0011_recovery_session_publishing.test.sql',
          ]:
              if item not in verify:
                  verify = verify.replace('const required = [', f"const required = [\n  {item!r},", 1)
          verify_path.write_text(verify, encoding='utf-8')

          docs_path = Path('docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md')
          docs = docs_path.read_text(encoding='utf-8').replace('Migrations 0027–0034', 'Migrations 0027–0035')
          if '### Facilitator planning' not in docs:
              docs += '''

### Facilitator planning

Participant summaries and restricted facilitator agendas are published atomically. The leader agenda may include meeting flow, discussion prompts, confidentiality reminders, safety notes, and referral reminders. It is accessible only to MFA-verified recovery leaders.
'''
          docs_path.write_text(docs, encoding='utf-8')
          PY

      - name: Remove superseded and temporary source workflows
        shell: bash
        run: |
          rm -f .github/workflows/temporary-ministry-final-source-v13.yml
          rm -rf .github/ministry-finalize-v13
          rm -rf .github/ministry-finalize-v15
          rm -f .github/workflows/temporary-ministry-explicit-source-v15.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit final explicit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: lock final ministry operational source"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
