name: Temporary Ministry Expansion Release Gate

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: temporary-ministry-expansion-release-gate
  cancel-in-progress: true

jobs:
  validate-and-merge:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out finalized feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Reset database through all migrations
        run: pnpm supabase:reset

      - name: Regenerate schema-derived database types
        run: pnpm supabase:types

      - name: Commit generated database types when needed
        id: types
        shell: bash
        run: |
          if git diff --quiet -- packages/database/src/generated.types.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/generated.types.ts
          git commit -m "chore: regenerate ministry database types"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run database authorization tests
        if: steps.types.outputs.changed != 'true'
        run: pnpm supabase:test

      - name: Run complete repository checks
        if: steps.types.outputs.changed != 'true'
        run: pnpm check

      - name: Build every workspace
        if: steps.types.outputs.changed != 'true'
        run: pnpm build

      - name: Run browser and accessibility tests
        if: steps.types.outputs.changed != 'true'
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop --no-backup || true

      - name: Remove temporary release workflow
        if: steps.types.outputs.changed != 'true'
        shell: bash
        run: |
          rm -f .github/workflows/temporary-ministry-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete ministry expansion release validation"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries

      - name: Mark pull request ready and enable auto-merge
        if: steps.types.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feature/gifts-prayer-recovery-ministries --state open --json number --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open pull request found for the ministry feature branch."
            exit 1
          fi
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
