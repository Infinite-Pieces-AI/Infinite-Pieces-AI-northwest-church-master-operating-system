name: Temporary Format Ministry Expansion

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

concurrency:
  group: temporary-format-ministry-expansion
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format expansion
        run: pnpm exec prettier --write apps/outreach-command/lib/live-intelligence.ts apps/church-hub/app apps/church-hub/components apps/church-hub/lib apps/outreach-command/app apps/outreach-command/components apps/outreach-command/lib apps/public-web/app apps/public-web/components apps/public-web/lib packages/church-content/src packages/validation/src docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md docs/RELEASE_CHECKLIST_GIFTS_PRAYER_RECOVERY.md supabase/migrations supabase/tests tests/end-to-end

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format ministry expansion"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
