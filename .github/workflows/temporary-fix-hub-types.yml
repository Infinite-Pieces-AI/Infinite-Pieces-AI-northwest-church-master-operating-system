name: Temporary Fix Connected Hub Types

on:
  push:
    branches:
      - feature/connected-ministry-journey

permissions:
  contents: write

concurrency:
  group: temporary-fix-hub-types
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/connected-ministry-journey
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          page = Path("apps/church-hub/app/(protected)/this-week/page.tsx")
          text = page.read_text()
          text = text.replace(
              'import { fellowshipMeetups } from "@/lib/demo-data";\n',
              'import { fellowshipMeetups } from "@/lib/demo-data";\nimport { loadConnectionPathway } from "@/lib/connection-pathway";\n',
          )
          text = text.replace(
              '  const d = await loadThisWeekData(viewer);\n',
              '  const [d, connectionPathway] = await Promise.all([\n    loadThisWeekData(viewer),\n    loadConnectionPathway(viewer),\n  ]);\n',
          )
          text = text.replace(
              '      <ConnectionPathway />',
              '      <ConnectionPathway initial={connectionPathway} demo={viewer.demo} />',
          )
          page.write_text(text)

          demo = Path("apps/church-hub/lib/demo-data.ts")
          text = demo.read_text()
          text = text.replace('  capacity?: number;\n', '  capacity?: number | undefined;\n')
          text = text.replace('  spontaneous?: boolean;\n', '  spontaneous?: boolean | undefined;\n')
          text = text.replace(
              '  exactLocationAfterJoin?: boolean;\n',
              '  exactLocationAfterJoin?: boolean | undefined;\n',
          )
          demo.write_text(text)

          contract = Path("apps/church-hub/lib/fellowship-contract.ts")
          text = contract.read_text()
          text = text.replace('  startsAt?: string;\n', '  startsAt?: string | undefined;\n')
          text = text.replace('  endsAt?: string;\n', '  endsAt?: string | undefined;\n')
          text = text.replace('  timezone?: string;\n', '  timezone?: string | undefined;\n')
          text = text.replace(
              '  visibility?: FellowshipVisibility;\n',
              '  visibility?: FellowshipVisibility | undefined;\n',
          )
          contract.write_text(text)

          fellowship = Path("apps/church-hub/lib/fellowship.ts")
          text = fellowship.read_text()
          text = text.replace('  startsAt?: string;\n', '  startsAt?: string | undefined;\n')
          text = text.replace('  endsAt?: string;\n', '  endsAt?: string | undefined;\n')
          text = text.replace(
              '  visibility?: "church" | "ministry" | "group";\n',
              '  visibility?: "church" | "ministry" | "group" | undefined;\n',
          )
          fellowship.write_text(text)
      - run: pnpm exec prettier --write apps/church-hub/app/'(protected)'/this-week/page.tsx apps/church-hub/lib/demo-data.ts apps/church-hub/lib/fellowship-contract.ts apps/church-hub/lib/fellowship.ts
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/church-hub
          git commit -m "fix: initialize connection pathway and normalize fellowship optionals"
          git push origin HEAD:feature/connected-ministry-journey
