name: Temporary Ministry Final Source V13

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  install-final-source:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'feat: complete response management and recovery leader planning')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out operationally complete branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install final explicit Recovery API
        run: cp .github/ministry-finalize-v13/recovery-api.ts apps/church-hub/app/api/recovery/route.ts

      - name: Normalize final member components
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          prayer_path = "apps/church-hub/components/prayer-well-complete.tsx"
          prayer = read(prayer_path)
          if 'request.sensitivity !== "normal"' not in prayer:
              prayer = re.sub(
                  r'''if \(tab === "feed" && request\.status !== "open"\) return false;''',
                  '''if (
        tab === "feed" &&
        (request.status !== "open" || request.sensitivity !== "normal")
      ) {
        return false;
      }''',
                  prayer,
                  count=1,
              )
          if 'sensitivity === "normal" && data.get("allowEncouragement")' not in prayer:
              prayer = re.sub(
                  r'''allowEncouragement:\s*data\.get\("allowEncouragement"\) === "on",\s*allowPrayed:\s*data\.get\("allowPrayed"\) === "on",''',
                  '''allowEncouragement:
        sensitivity === "normal" && data.get("allowEncouragement") === "on",
      allowPrayed:
        sensitivity === "normal" && data.get("allowPrayed") === "on",''',
                  prayer,
                  count=1,
              )
          if 'request.sensitivity !== "normal"' not in prayer:
              raise RuntimeError("Prayer feed sensitivity filter was not installed")
          if 'sensitivity === "normal" && data.get("allowEncouragement")' not in prayer:
              raise RuntimeError("Restricted prayer interaction controls were not disabled")
          write(prayer_path, prayer)

          recovery_path = "apps/church-hub/components/recovery-ministry.tsx"
          recovery = read(recovery_path)
          if "leaderAgenda?: string;" not in recovery:
              recovery = recovery.replace(
                  "  progress: ProgressStatus;\n}",
                  "  progress: ProgressStatus;\n  leaderAgenda?: string;\n  safetyNotes?: string;\n}",
                  1,
              )
          if "programId?: string;" not in recovery:
              recovery = recovery.replace(
                  "  officialProgramConfirmed: boolean;\n}) {",
                  "  officialProgramConfirmed: boolean;\n  programId?: string;\n}) {",
                  1,
              )
              recovery = recovery.replace(
                  "  officialProgramConfirmed,\n}: {",
                  "  officialProgramConfirmed,\n  programId,\n}: {",
                  1,
              )
          if "const [programDetails" not in recovery:
              recovery = recovery.replace(
                  '  const [guideQuestion, setGuideQuestion] = useState("");',
                  '''  const [guideQuestion, setGuideQuestion] = useState("");
  const [programDetails, setProgramDetails] = useState({
    meetingDay: "Sunday",
    meetingTime: "08:30",
    generalLocation: "Approved participants receive exact room directions privately.",
  });''',
                  1,
              )
          if "encodeURIComponent(programId)" not in recovery:
              recovery = recovery.replace(
                  '      const response = await fetch("/api/recovery", { cache: "no-store" });',
                  '''      const query = programId
        ? `?programId=${encodeURIComponent(programId)}`
        : "";
      const response = await fetch(`/api/recovery${query}`, { cache: "no-store" });''',
                  1,
              )
          if "payload.program?.meetingDay" not in recovery:
              recovery = recovery.replace(
                  "      setMembershipRole(payload.membershipRole ?? null);",
                  '''      setMembershipRole(payload.membershipRole ?? null);
      if (payload.program) {
        setProgramDetails({
          meetingDay: payload.program.meetingDay ?? "Meeting",
          meetingTime: payload.program.meetingTime ?? "",
          generalLocation:
            payload.program.generalLocation ??
            "Approved participants receive exact room directions privately.",
        });
      }''',
                  1,
              )
          if "JSON.stringify({ action, programId, ...payload })" not in recovery:
              recovery = recovery.replace(
                  "      body: JSON.stringify({ action, ...payload }),",
                  "      body: JSON.stringify({ action, programId, ...payload }),",
                  1,
              )
          if 'leaderAgenda: String(data.get("leaderAgenda")' not in recovery:
              recovery = recovery.replace(
                  '      scheduledFor: String(data.get("scheduledFor") ?? "") || undefined,',
                  '''      scheduledFor: String(data.get("scheduledFor") ?? "") || undefined,
      leaderAgenda: String(data.get("leaderAgenda") ?? "").trim(),
      safetyNotes:
        String(data.get("safetyNotes") ?? "").trim() || undefined,''',
                  1,
              )
          if "programDetails.meetingDay" not in recovery:
              recovery = re.sub(
                  r'''<p>Sunday gathering</p>\s*<h3>8:30 AM before worship</h3>\s*<span>Approved participants receive exact room directions privately\.</span>''',
                  '''<p>{programDetails.meetingDay} gathering</p>
            <h3>{formatRecoveryTime(programDetails.meetingTime)}</h3>
            <span>{programDetails.generalLocation}</span>''',
                  recovery,
                  count=1,
              )
          if 'name="leaderAgenda"' not in recovery:
              recovery = re.sub(
                  r'''(<label>Scheduled date/time<input name="scheduledFor" type="datetime-local" /></label>)\s*(<button type="submit">Publish participant guide</button>)''',
                  '''\1
            <label className="span-2">
              Facilitator agenda
              <textarea
                name="leaderAgenda"
                rows={8}
                required
                minLength={10}
                maxLength={10000}
                placeholder="Welcome, confidentiality reminder, teaching flow, discussion prompts, next-step plan, and close."
              />
            </label>
            <label className="span-2">
              Safety and referral notes
              <textarea
                name="safetyNotes"
                rows={5}
                maxLength={5000}
                placeholder="Current emergency boundary, treatment-resource reminders, and issues requiring a private leader follow-up."
              />
            </label>
            <button type="submit">Publish participant guide and leader agenda</button>''',
                  recovery,
                  count=1,
              )
          if "leader-session-plans" not in recovery:
              recovery = recovery.replace(
                  '          </form>\n          <aside className="leader-checklist">',
                  '''          </form>
          <div className="leader-session-plans">
            <h3>Published facilitator plans</h3>
            {sessions
              .filter((session) => session.leaderAgenda)
              .map((session) => (
                <article key={session.id}>
                  <span>Week {session.week}</span>
                  <strong>{session.title}</strong>
                  <p>{session.leaderAgenda}</p>
                  {session.safetyNotes ? <small>{session.safetyNotes}</small> : null}
                </article>
              ))}
          </div>
          <aside className="leader-checklist">''',
                  1,
              )
          if "function formatRecoveryTime" not in recovery:
              recovery += '''

function formatRecoveryTime(value: string): string {
  if (!value) return "Time shared by the leader";
  const [hourText, minuteText = "00"] = value.split(":");
  const hour = Number(hourText);
  if (!Number.isFinite(hour)) return value;
  const suffix = hour >= 12 ? "PM" : "AM";
  const displayHour = hour % 12 || 12;
  return `${displayHour}:${minuteText.slice(0, 2)} ${suffix}`;
}
'''
          if 'id: "recovery-week-3"' in recovery and "Opening and confidentiality" not in recovery:
              recovery = recovery.replace(
                  '    scheduledFor: new Date(Date.now() + 2 * 24 * 60 * 60_000).toISOString(),',
                  '''    scheduledFor: new Date(Date.now() + 2 * 24 * 60 * 60_000).toISOString(),
    leaderAgenda:
      "Opening and confidentiality reminder; Scripture and teaching; discussion prompts; responsible next-step plan; resource reminder; close in prayer.",
    safetyNotes:
      "Review the emergency boundary and current treatment referral resources before the group begins.",''',
                  1,
              )
          required_markers = [
              "programId?: string;",
              "leaderAgenda?: string;",
              "programDetails.meetingDay",
              'name="leaderAgenda"',
              "leader-session-plans",
              "formatRecoveryTime",
          ]
          missing = [marker for marker in required_markers if marker not in recovery]
          if missing:
              raise RuntimeError(f"Recovery component finalization missing: {missing}")
          write(recovery_path, recovery)

          gate_path = "apps/church-hub/components/recovery-ministry-gate.tsx"
          gate = read(gate_path)
          if "programId={currentMembership.id}" not in gate:
              gate = gate.replace(
                  "          officialProgramConfirmed={currentMembership.officialProgramConfirmation}\n        />",
                  "          officialProgramConfirmed={currentMembership.officialProgramConfirmation}\n          programId={currentMembership.id}\n        />",
                  1,
              )
          if "programId={currentMembership.id}" not in gate:
              raise RuntimeError("Recovery program selection was not connected to the participant API")
          write(gate_path, gate)

          gifts_path = "apps/church-hub/components/gifts-of-church.tsx"
          gifts = read(gifts_path)
          for marker in ["updateResponseStatus", "gift-response-panel", "updatePostStatus"]:
              if marker not in gifts:
                  raise RuntimeError(f"Gift response lifecycle missing marker: {marker}")

          verify_path = "scripts/verify-structure.mjs"
          verify = read(verify_path)
          additions = [
              "supabase/migrations/0035_transactional_recovery_session_publishing.sql",
              "supabase/tests/0011_recovery_session_publishing.test.sql",
          ]
          for item in additions:
              if item not in verify:
                  verify = verify.replace("const required = [", f"const required = [\n  {item!r},", 1)
          write(verify_path, verify)

          docs_path = "docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md"
          docs = read(docs_path).replace("Migrations 0027–0034", "Migrations 0027–0035")
          if "### Facilitator planning" not in docs:
              docs += '''

### Facilitator planning

Participant summaries and restricted facilitator agendas are published atomically. The leader agenda may include meeting flow, discussion prompts, confidentiality reminders, safety notes, and referral reminders. It is accessible only to MFA-verified recovery leaders.
'''
          write(docs_path, docs)
          PY

      - name: Remove temporary V13 artifacts
        shell: bash
        run: |
          rm -rf .github/ministry-finalize-v13
          rm -f .github/workflows/temporary-ministry-final-source-v13.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit final source of truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: lock final ministry operational source"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
