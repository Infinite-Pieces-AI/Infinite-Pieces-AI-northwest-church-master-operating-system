name: Temporary Recovery Outreach Role Boundary V8

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  narrow-recovery-outreach:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'security: finalize explicit ministry page authorization')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out explicitly authorized branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Apply narrow Recovery Outreach authorization
        shell: bash
        run: |
          cp .github/ministry-finalize-v8/outreach-nav.tsx apps/outreach-command/components/outreach-nav.tsx
          cp .github/ministry-finalize-v8/outreach-shell.tsx apps/outreach-command/components/outreach-shell.tsx
          cp .github/ministry-finalize-v8/recovery-outreach-page.tsx 'apps/outreach-command/app/(protected)/recovery-outreach/page.tsx'
          python <<'PY'
          from pathlib import Path

          api_path = Path('apps/outreach-command/app/api/recovery-outreach/route.ts')
          api = api_path.read_text(encoding='utf-8')
          if 'from "@/lib/auth/recovery-outreach"' not in api:
              api = api.replace(
                  'import { getOutreachApiViewer } from "@/lib/auth/api-viewer";',
                  'import { getOutreachApiViewer } from "@/lib/auth/api-viewer";\nimport { canManageRecoveryOutreach } from "@/lib/auth/recovery-outreach";',
              )
          api = api.replace(
              'if (!viewer) {\n    return NextResponse.json({ message: "MFA-verified Outreach access is required." }, { status: 401 });\n  }',
              'if (!viewer || !canManageRecoveryOutreach(viewer.roles)) {\n    return NextResponse.json(\n      { message: "MFA-verified minister Recovery Outreach access is required." },\n      { status: 403 },\n    );\n  }',
          )
          api_path.write_text(api, encoding='utf-8')

          verify_path = Path('scripts/verify-structure.mjs')
          verify = verify_path.read_text(encoding='utf-8')
          additions = [
              'supabase/migrations/0034_close_gift_update_and_recovery_inquiry_edges.sql',
              'supabase/tests/0010_ministry_edge_authorization.test.sql',
              'apps/outreach-command/lib/auth/recovery-outreach.ts',
          ]
          for item in additions:
              if item not in verify:
                  verify = verify.replace('const required = [', f"const required = [\n  {item!r},", 1)
          verify_path.write_text(verify, encoding='utf-8')

          docs_path = Path('docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md')
          docs = docs_path.read_text(encoding='utf-8').replace('Migrations 0027–0033', 'Migrations 0027–0034')
          docs_path.write_text(docs, encoding='utf-8')

          checklist_path = Path('docs/RELEASE_CHECKLIST_GIFTS_PRAYER_RECOVERY.md')
          checklist = checklist_path.read_text(encoding='utf-8')
          if 'Recovery inquiries are readable only by MFA-verified ministers/super administrators.' not in checklist:
              checklist = checklist.replace(
                  '- [ ] Public recovery inquiries are excluded from enhanced conversions and audience creation.',
                  '- [ ] Public recovery inquiries are excluded from enhanced conversions and audience creation.\n- [ ] Recovery inquiries are readable only by MFA-verified ministers/super administrators.',
              )
          checklist_path.write_text(checklist, encoding='utf-8')
          PY

      - name: Remove temporary V8 artifacts
        shell: bash
        run: |
          rm -rf .github/ministry-finalize-v8
          rm -f .github/workflows/temporary-recovery-outreach-role-boundary-v8.yml

      - name: Install dependencies and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Verify required architecture
        run: pnpm verify:structure

      - name: Commit narrowed Recovery Outreach boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: narrow Recovery Outreach inquiry access"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
