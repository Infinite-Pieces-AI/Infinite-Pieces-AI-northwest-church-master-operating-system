name: Temporary Outreach Lockfile Refresh

on:
  push:
    branches:
      - feature/outreach-intelligence-os

permissions:
  contents: write

concurrency:
  group: temporary-outreach-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Outreach feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/outreach-intelligence-os
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for Outreach Intelligence OS"
          git push origin HEAD:feature/outreach-intelligence-os
