name: Temporary Format Release Readiness

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

concurrency:
  group: temporary-format-release-readiness
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format release files
        run: pnpm exec prettier --write apps/church-hub/components/gift-moderation-console.tsx apps/church-hub/components/prayer-leader-console.tsx apps/church-hub/app/\(protected\)/admin/gifts/page.tsx apps/church-hub/app/\(protected\)/admin/prayer/page.tsx apps/outreach-command/lib/live-intelligence.ts
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/temporary-format-release-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "chore: format ministry release files"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
