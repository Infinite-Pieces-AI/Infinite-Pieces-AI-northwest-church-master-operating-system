name: Temporary Ministry Release Candidate V18

on:
  push:
    branches:
      - feature/gifts-prayer-recovery-ministries

permissions:
  contents: write

jobs:
  finalize-release-candidate:
    if: github.actor == 'github-actions[bot]' && contains(github.event.head_commit.message, 'security: finish ministry interaction integrity')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out interaction-safe branch
        uses: actions/checkout@v4
        with:
          ref: feature/gifts-prayer-recovery-ministries
          fetch-depth: 0

      - name: Install final administration sources
        shell: bash
        run: |
          cp .github/ministry-finalize-v18/admin-gifts-api.ts apps/church-hub/app/api/admin/gifts/route.ts
          cp .github/ministry-finalize-v18/gift-moderation-console.tsx apps/church-hub/components/gift-moderation-console.tsx
          cp .github/ministry-finalize-v18/admin-gifts-page.tsx 'apps/church-hub/app/(protected)/admin/gifts/page.tsx'
          cp .github/ministry-finalize-v18/admin-prayer-api.ts apps/church-hub/app/api/admin/prayer/route.ts
          cp .github/ministry-finalize-v18/prayer-leader-console.tsx apps/church-hub/components/prayer-leader-console.tsx
          cp .github/ministry-finalize-v18/admin-prayer-page.tsx 'apps/church-hub/app/(protected)/admin/prayer/page.tsx'

      - name: Enforce live empty states and finalize release metadata
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          prayer_path = "apps/church-hub/components/prayer-well-complete.tsx"
          prayer = read(prayer_path)
          if "const emptyPrayerPayload" not in prayer:
              marker = "export function PrayerWellComplete"
              index = prayer.find(marker)
              if index == -1:
                  raise RuntimeError("Unable to locate Prayer Well component")
              empty = '''const emptyPrayerPayload: PrayerPayload = {
  audiences: { groups: [], ministries: [] },
  requests: [],
};

'''
              prayer = prayer[:index] + empty + prayer[index:]
          prayer = prayer.replace(
              '''const [payload, setPayload] = useState<PrayerPayload>({
    audiences: previewAudiences,
    requests: previewRequests,
  });''',
              '''const [payload, setPayload] = useState<PrayerPayload>(
    mode === "showcase"
      ? { audiences: previewAudiences, requests: previewRequests }
      : emptyPrayerPayload,
  );''',
          )
          prayer = prayer.replace(
              'const [selectedId, setSelectedId] = useState<string | null>(previewRequests[0]?.id ?? null);',
              'const [selectedId, setSelectedId] = useState<string | null>(\n    mode === "showcase" ? previewRequests[0]?.id ?? null : null,\n  );',
          )
          if "mode === \"showcase\"" not in prayer or "emptyPrayerPayload" not in prayer:
              raise RuntimeError("Prayer Well live empty state was not installed")
          write(prayer_path, prayer)

          verify_path = "scripts/verify-structure.mjs"
          verify = read(verify_path)
          required = [
              "supabase/migrations/0037_lock_ministry_interaction_record_identity.sql",
              "supabase/migrations/0038_gift_moderation_notes.sql",
              "supabase/tests/0013_ministry_interaction_identity.test.sql",
              "apps/church-hub/app/api/admin/gifts/route.ts",
              "apps/church-hub/app/api/admin/prayer/route.ts",
              "apps/church-hub/components/gift-moderation-console.tsx",
              "apps/church-hub/components/prayer-leader-console.tsx",
              "tests/end-to-end/admin-gifts-prayer.spec.ts",
          ]
          for item in required:
              if item not in verify:
                  verify = verify.replace("const required = [", f"const required = [\n  {item!r},", 1)
          write(verify_path, verify)

          docs_path = "docs/GIFTS_PRAYER_RECOVERY_MINISTRIES.md"
          docs = read(docs_path)
          docs = docs.replace("Migrations 0027–0036", "Migrations 0027–0038")
          docs = docs.replace("Migrations 0027–0037", "Migrations 0027–0038")
          if "## Administration showrooms" not in docs:
              docs += '''

## Administration showrooms

Explicit local preview mode includes an interactive gift-moderation queue and restricted prayer-routing queue. Decisions persist only inside the browser showcase. Live mode begins empty and requires real authenticated AAL2/MFA roles and Supabase records; it never falls back to fictional moderation, prayer, recovery, organization, or inquiry activity.
'''
          write(docs_path, docs)

          checklist_path = "docs/RELEASE_CHECKLIST_GIFTS_PRAYER_RECOVERY.md"
          checklist = read(checklist_path)
          additions = [
              "- [ ] Gift moderation preview and live queue both complete approve/reject/remove decisions.",
              "- [ ] Restricted prayer preview and live queue both complete assignment/resolution/archive decisions.",
              "- [ ] Live Prayer Well initializes empty and never falls back to preview requests.",
              "- [ ] Gift response, prayer interaction, and recovery post/comment record identities remain immutable during updates.",
          ]
          if additions[0] not in checklist:
              checklist += "\n" + "\n".join(additions) + "\n"
          write(checklist_path, checklist)

          readme_path = "README.md"
          readme = read(readme_path)
          if "Gift moderation and restricted prayer routing" not in readme:
              readme += '''

### Ministry administration

Gift moderation and restricted prayer routing have both browser-only interactive showrooms and real MFA/RLS-backed production APIs. Recovery access, participant journeys, private discussion, leader planning, public recovery support, and Recovery Outreach follow the same preview-versus-live boundary.
'''
          write(readme_path, readme)
          PY

      - name: Remove obsolete and temporary release-candidate artifacts
        shell: bash
        run: |
          rm -f apps/church-hub/components/prayer-well.tsx
          rm -rf .github/ministry-finalize-v18
          rm -f .github/workflows/temporary-ministry-release-candidate-v18.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and format
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Verify required architecture
        run: pnpm verify:structure

      - name: Commit final release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: finalize ministry release candidate"
          git push origin HEAD:feature/gifts-prayer-recovery-ministries
